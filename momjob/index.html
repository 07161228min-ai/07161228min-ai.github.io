function begin(){ cur=0; ans=[]; show("quiz"); render(); track('start'); }
function render(){
  const [q, opts] = Q[cur];
  $("qno").textContent = `Q${cur+1} / ${Q.length}`;
  $("prog").style.width = `${cur/Q.length*100}%`;
  $("qtext").textContent = R(q);
  $("opts").innerHTML = "";
  const shuffled = opts.map((o,i)=>[o,(i*7+cur*3)%4]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  shuffled.forEach(([t,label])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=R(label);
    if (ans[cur]===t) b.classList.add("on");
    b.onclick=()=>{ b.classList.add("on"); ans[cur]=t; setTimeout(next,170); };
    $("opts").appendChild(b);
  });
  $("back").style.visibility = cur ? "visible" : "hidden";
}
function next(){ if (cur < Q.length-1){ cur++; render(); } else finish(); }

function scores(a){ const s={}; ORDER.forEach(k=>s[k]=0); a.forEach(t=>s[t]++); return s; }

  const s = scores(ans);
  let top = ORDER.reduce((a,b)=> s[b]>s[a]?b:a, ORDER[0]);
  const tied = ORDER.filter(k=>s[k]===s[top]);
  if (tied.length>1){ for (let i=ans.length-1;i>=0;i--){ if (tied.includes(ans[i])){ top=ans[i]; break; } } }
  const keep = `${WHO==="dad"?"&who=dad":""}${PT?"&pt="+PT:""}${from!=="direct"?"&from="+from:""}${BGQ}`;
  history.replaceState(null,"",`?r=${top}&m=${ORDER.map(k=>s[k].toString(16)).join("")}${keep}`);

}
function showResult(k, s, pk=false){

  $("others").innerHTML = ORDER.filter(x=>x!==k).map(x=>`<button onclick="${x===(window._mine||k)?'backMine()':`peek('${x}')`}"><img src="img/${x}.jpg" alt="">${TYPES[x].emoji} ${nm(x)}</button>`).join("");
  const mine = window._mine || k;
  if (PT && k===mine && !pk){
    const c = getCompat(mine, PT);

    $("compat").innerHTML = `<div class="ct">💑 ${D.label.compat}</div>

      <div class="cd">${c.d}</div><div class="ctip">💡 ${c.tip}</div>`;

  track('share');

    text = D.share ? D.share[WHO].replace("{T}", `${TYPES[k].emoji} ${nm(k)}`) : `나는 ${TYPES[k].emoji} ${nm(k)}래 😂 ${OTHER}는 무슨 유형일까? 1분이면 끝, 다 하면 우리 궁합 나와!`;

      ctx.fillStyle="#2f2b36"; ctx.textAlign="right"; ctx.fillText(`${p}%`, 980, y+30); ctx.textAlign="left"; });
    ctx.textAlign = "center";
    if (PT){ const c = getCompat(k, PT);
      ctx.fillStyle = D.main; ctx.font = "900 38px Pretendard, sans-serif";
      ctx.fillText(`💑 ${D.label.compatShort} ${c.s}점 · ${c.t}`, 540, 1250); }
    ctx.fillStyle = D.main; ctx.font = "800 30px Pretendard, sans-serif";
    ctx.fillText(D.label.card, 540, 1310);
    cv.toBlob(async b => {
      const f = new File([b], `${D.slug}_${nm(k)}.png`, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[f]})){ try { await navigator.share({files:[f]}); return; } catch(e){ if (e.name==="AbortError") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
      toast("결과 카드를 저장했어요");
    }, "image/png");
  };
}

(function(){
  if (QS.has('who') || PT){ $('both').classList.add('hide'); $('btndad').classList.add('hide'); $('btnmom').textContent = '테스트 시작하기'; }
  if (QS.get('go')==='1'){ const q=new URLSearchParams(location.search); q.delete('go'); history.replaceState(null,'',location.pathname+'?'+q.toString()); setTimeout(begin,0); }
  const r = QS.get("r"), m = QS.get("m");
  $("chips").innerHTML = ORDER.map(k=>`<span class="chip">${TYPES[k].emoji} ${short(k)}</span>`).join("");
  $("count").textContent = `${Q.length}문항 · 약 1분 · 답은 저장되지 않아요`;
  if (WHO==="dad"){ document.querySelectorAll("h1 em").forEach(e=>e.textContent=e.textContent.replace("엄마","아빠")); document.title = R(document.title); }
  $("rnote").innerHTML = `재미로 보는 테스트예요. 정답인 ${ROLE} 유형은 없어요 💜${D.note?"<br>"+D.note:""}<br>${D.brand}`;
  $("more").innerHTML = `<h3>🎲 이 테스트도 해 보세요</h3>` + REC.map(x=>`<a href="${x.url}?from=rec${BGQ}" onclick="track('rec')"><img src="${x.img}" alt="" loading="lazy"><div><b>${x.title}</b><span>${x.sub}</span></div></a>`).join("");
  if (D.both) $("both").textContent = D.both;
  if (D.follow){ $("follow").innerHTML = `<p>${D.follow.text}</p><small>${D.follow.small}</small><a href="${D.follow.url}" target="_blank" rel="noopener" onclick="track('follow')">${D.follow.btn}</a>`; $("follow").classList.remove("hide"); }
  if (PT){ $("invite").innerHTML = `${OTHER}는 ${TYPES[PT].emoji} <b>${ptName(PT)}</b>래요!<br>내 유형까지 알면 💑 우리 집 궁합이 나와요`; $("invite").classList.remove("hide"); }
  if (r && TYPES[r] && m && new RegExp(`^[0-9a-f]{${ORDER.length}}$`).test(m) && (from==="direct" || QS.get("v")==="1")){
    const s={}; ORDER.forEach((k,i)=>s[k]=parseInt(m[i],16)); window._mine = r; showResult(r, s); }
})();
</script>
