<style>
:root { --pu:#4a5a9c; --pu2:#7182c4; --mint:#3d8a68; --bg:#fbf8f3; --ink:#2f2b36; --sub:#6b6577; --line:#e8e1f1; --soft:#eef0fa; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg); }
body { font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); word-break:keep-all; line-height:1.5; }
.wrap { max-width:460px; margin:0 auto; padding:18px 18px 40px; min-height:100vh; }
.brand { text-align:center; font-size:13px; font-weight:700; color:var(--pu); letter-spacing:.5px; margin-bottom:12px; }
.card { background:#fff; border-radius:22px; box-shadow:0 6px 24px rgba(60,40,90,.10); overflow:hidden; }
.hero img { width:100%; display:block; aspect-ratio:4/5; object-fit:cover; }
.pad { padding:20px 20px 22px; }

.lead { color:var(--sub); font-size:15px; margin-top:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip { font-size:13px; font-weight:700; background:var(--soft); color:var(--pu); padding:4px 10px; border-radius:99px; }
.btn { display:block; width:100%; border:0; border-radius:16px; padding:16px; font:inherit; font-size:17px; font-weight:800; cursor:pointer; text-align:center; text-decoration:none; }
.btn.main { background:var(--pu); color:#fff; margin-top:18px; box-shadow:0 4px 0 rgba(0,0,0,.25); }
.btn.main:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
.btn.line { background:#fff; color:var(--pu); border:2px solid var(--pu); margin-top:10px; }
.count { text-align:center; color:var(--sub); font-size:13px; margin-top:12px; }
.bar { height:8px; background:var(--soft); border-radius:99px; overflow:hidden; margin:4px 0 14px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--pu2),var(--pu)); border-radius:99px; transition:width .3s; }
.qno { font-size:14px; font-weight:800; color:var(--pu); }
.qtext { font-size:21px; font-weight:800; line-height:1.38; margin:6px 0 16px; letter-spacing:-.3px; }
.opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:16px; padding:15px 16px; font:inherit; font-size:16px; font-weight:600; color:var(--ink); margin-bottom:10px; cursor:pointer; transition:.12s; }
.opt:active, .opt.on { border-color:var(--pu); background:var(--soft); }
.back { background:none; border:0; color:var(--sub); font:inherit; font-size:14px; margin-top:6px; cursor:pointer; padding:6px; }
.rtop { text-align:center; padding:20px 20px 6px; }
.rsmall { font-size:14px; color:var(--sub); font-weight:700; }
.rname { font-size:30px; font-weight:900; margin-top:4px; letter-spacing:-.6px; }
.rline { font-size:16px; color:var(--pu); font-weight:800; margin-top:6px; }
.rimg { width:100%; display:block; aspect-ratio:4/5; object-fit:cover; margin-top:12px; }
.sec { padding:16px 20px 4px; }
.sec h3 { font-size:16px; font-weight:800; margin-bottom:8px; }
.sec p, .sec li { font-size:15px; color:#433d4d; }
.sec ul { list-style:none; }
.sec li { padding-left:20px; position:relative; margin-bottom:6px; }
.sec li::before { content:"✔"; position:absolute; left:0; color:var(--mint); font-weight:900; }
.mix .row { display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:14px; font-weight:700; }
.mix .row span:first-child { width:110px; flex:none; }
.mix .track { flex:1; height:12px; background:var(--soft); border-radius:99px; overflow:hidden; }
.mix .track i { display:block; height:100%; border-radius:99px; }
.mix .row b { width:40px; text-align:right; flex:none; }
.pair { display:flex; gap:10px; }
.pair div { flex:1; background:var(--soft); border-radius:14px; padding:10px 12px; font-size:14px; }
.pair b { display:block; font-size:13px; color:var(--sub); margin-bottom:2px; }
.ctas { padding:10px 20px 18px; }
.note { font-size:12px; color:#9a94a5; text-align:center; margin-top:16px; line-height:1.6; }
.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#2f2b36; color:#fff; padding:10px 16px; border-radius:99px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; }
.toast.on { opacity:.95; }
.hide { display:none !important; }
.both { margin-top:16px; font-size:14px; font-weight:700; color:var(--sub); text-align:center; }
.both + .btn.main { margin-top:8px; }
.others { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px 20px 6px; }
.others button { border:0; background:var(--soft); border-radius:14px; padding:8px; font:inherit; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left; }
.others img { width:42px; height:52px; object-fit:cover; border-radius:8px; }
.invite { background:#fff4d6; border-radius:14px; padding:10px 14px; font-size:15px; font-weight:700; margin-top:12px; }
.compat { margin:16px 20px 4px; background:linear-gradient(135deg,var(--soft),#fff4f0); border:2px solid var(--line); border-radius:18px; padding:16px; text-align:center; }
.compat .ct { font-size:14px; font-weight:800; color:var(--sub); }
.compat .cp { font-size:17px; font-weight:800; margin-top:6px; }
.compat .cs { font-size:40px; font-weight:900; color:var(--pu); line-height:1.1; margin-top:6px; }

.compat .cn { font-size:18px; font-weight:900; margin-top:2px; }
.compat .cd { font-size:15px; color:#433d4d; margin-top:8px; text-align:left; }
.compat .ctip { font-size:14px; color:var(--mint); font-weight:700; margin-top:8px; text-align:left; }

      <button class="btn line" onclick="restart()" style="border-color:#d8d2e0;color:var(--sub)">↺ 다시 하기</button>

    <div class="sec" style="padding-top:8px"><h3 style="font-size:14px;color:var(--sub)">다른 유형도 구경하기</h3></div>
    <div class="others" id="others"></div>
    <p class="note" id="rnote" style="padding:0 20px 18px"></p>

</div>

const REC = [{"url": "https://07161228min-ai.github.io/dungwon/", "img": "https://07161228min-ai.github.io/dungwon/img/cover.jpg", "title": "아침 등원 전쟁, 나는 무슨 엄마?", "sub": "시계토끼 · 협상가 · 소방관 · 느긋 판다"}, {"url": "https://07161228min-ai.github.io/cart/", "img": "https://07161228min-ai.github.io/cart/img/cover.jpg", "title": "장보기 카트로 보는 엄마 유형", "sub": "리스트 장인 · 1+1 사냥꾼 · 간식 협상가 · 일단 담고 보는"}, {"url": "https://07161228min-ai.github.io/kidscafe/", "img": "https://07161228min-ai.github.io/kidscafe/img/cover.jpg", "title": "키즈카페에서 나는 무슨 엄마?", "sub": "밀착 경호원 · 커피 사수 · 같이 노는 · 충전기 자리 사수"}];
const TYPES = D.types, ORDER = Object.keys(TYPES), Q = D.questions;
let cur = 0, ans = [];
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const from = QS.get("from") || "direct";
const WHO = QS.get("who")==="dad" ? "dad" : "mom";
const ROLE = WHO==="dad" ? "아빠" : "엄마", OTHER = WHO==="dad" ? "엄마" : "아빠";
const BG = QS.get("b")==="1", BGQ = BG ? "&b=1" : "";
const PT = TYPES[QS.get("pt")] ? QS.get("pt") : null;
const R = s => WHO==="dad" ? s.replaceAll("엄마","아빠") : s;
const RO = s => WHO==="dad" ? s.replaceAll("아빠","엄마") : s;
const F = s => s.replaceAll("{ROLE}", ROLE).replaceAll("{OTHER}", OTHER);
const nm = k => TYPES[k].name.replace("엄마", ROLE);
const ptName = k => TYPES[k].name.replace("엄마", OTHER);
const short = k => TYPES[k].name.replace(" 엄마","");
const ckey = (a,b) => [a,b].sort((x,y)=>ORDER.indexOf(x)-ORDER.indexOf(y)).join("");
const getCompat = (a,b) => D.compat[ckey(a,b)];

function track(ev){ try{ if (window.gtag) gtag('event', ev, {from}); }catch(e){} }
function show(id){ ["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide", s!==id)); window.scrollTo(0,0); }
function startAs(){ const q=new URLSearchParams(location.search); ['r','m','v','pt'].forEach(x=>q.delete(x)); q.set('who','dad'); q.set('go','1'); location.replace(location.pathname+'?'+q.toString()); }
function begin(){ cur=0; ans=[]; show("quiz"); render(); track('start'); }
function render(){
  const [q, opts] = Q[cur];
  $("qno").textContent = `Q${cur+1} / ${Q.length}`;
  $("prog").style.width = `${cur/Q.length*100}%`;
  $("qtext").textContent = R(q);
  $("opts").innerHTML = "";
  const shuffled = opts.map((o,i)=>[o,(i*7+cur*3)%4]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  shuffled.forEach(([t,label])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=R(label);
    if (ans[cur]===t) b.classList.add("on");
    b.onclick=()=>{ b.classList.add("on"); ans[cur]=t; setTimeout(next,170); };
    $("opts").appendChild(b);
  });
  $("back").style.visibility = cur ? "visible" : "hidden";
}
function next(){ if (cur < Q.length-1){ cur++; render(); } else finish(); }
function prev(){ if (cur>0){ cur--; render(); } }
function scores(a){ const s={}; ORDER.forEach(k=>s[k]=0); a.forEach(t=>s[t]++); return s; }
function finish(){
  const s = scores(ans);
  let top = ORDER.reduce((a,b)=> s[b]>s[a]?b:a, ORDER[0]);
  const tied = ORDER.filter(k=>s[k]===s[top]);
  if (tied.length>1){ for (let i=ans.length-1;i>=0;i--){ if (tied.includes(ans[i])){ top=ans[i]; break; } } }
  const keep = `${WHO==="dad"?"&who=dad":""}${PT?"&pt="+PT:""}${from!=="direct"?"&from="+from:""}${BGQ}`;
  history.replaceState(null,"",`?r=${top}&m=${ORDER.map(k=>s[k].toString(16)).join("")}${keep}`);
  window._mine = top;
  showResult(top, s);
  track('finish');
}
function showResult(k, s, pk=false){
  const t = TYPES[k];
  $("mixsec").classList.toggle("hide", pk); $("mybtn").classList.toggle("hide", !pk);
  $("rsmall").textContent = pk ? "다른 유형 구경 중 👀" : F(D.label.result);
  $("rname").textContent = `${t.emoji} ${nm(k)}`;
  $("rname").style.color = t.color;
  $("rline").textContent = R(t.line);
  $("rimg").src = `img/${k}.jpg`; $("rimg").alt = nm(k);
  $("rdesc").textContent = R(t.desc);
  $("hmix").textContent = D.label.mix;
  $("htips").textContent = D.label.tips;
  $("rgood").innerHTML = t.good.map(x=>`<li>${R(x)}</li>`).join("");
  $("rtips").innerHTML = t.tips.map(x=>`<li>${R(x)}</li>`).join("");
  $("lbest").textContent = F(D.label.best); $("lworst").textContent = F(D.label.worst);
  $("rbest").textContent = `${TYPES[t.best].emoji} ${ptName(t.best)}`;
  $("rworst").textContent = `${TYPES[t.worst].emoji} ${ptName(t.worst)}`;
  const total = ORDER.reduce((a,b)=>a+s[b],0) || 1;
  $("mix").innerHTML = ORDER.map(x=>{ const p=Math.round(s[x]/total*100);
    return `<div class="row"><span>${TYPES[x].emoji} ${short(x)}</span><div class="track"><i style="width:${p}%;background:${TYPES[x].color}"></i></div><b>${p}%</b></div>`; }).join("");
  $("others").innerHTML = ORDER.filter(x=>x!==k).map(x=>`<button onclick="${x===(window._mine||k)?'backMine()':`peek('${x}')`}"><img src="img/${x}.jpg" alt="">${TYPES[x].emoji} ${nm(x)}</button>`).join("");
  const mine = window._mine || k;
  if (PT && k===mine && !pk){
    const c = getCompat(mine, PT);
    const momK = WHO==="mom" ? mine : PT, dadK = WHO==="mom" ? PT : mine;
    $("compat").innerHTML = `<div class="ct">💑 ${D.label.compat}</div>
      <div class="cp">엄마 ${TYPES[momK].emoji} ${short(momK)} × 아빠 ${TYPES[dadK].emoji} ${short(dadK)}</div>
      <div class="cs">${c.s}<small>점</small></div><div class="cn">${c.t}</div>
      <div class="cd">${c.d}</div><div class="ctip">💡 ${c.tip}</div>`;
    $("compat").classList.remove("hide");
    $("sharebtn").textContent = `💑 우리 궁합 결과 ${OTHER}에게 보내기`;
  } else {
    $("compat").classList.add("hide");
    $("sharebtn").textContent = WHO==="mom" ? "👨 아빠는 무슨 유형일까? 보내기" : "👩 엄마는 무슨 유형일까? 보내기";
  }
  window._res = {k: mine, s};
  show("result");
}
function peek(x){ const s = window._res ? window._res.s : scores([]); showResult(x, s, true); }
function backMine(){ if (window._res) showResult(window._res.k, window._res.s); }
function restart(){ const q = [WHO==="dad"?"who=dad":"", PT?"pt="+PT:"", BG?"b=1":"", from!=="direct"?"from="+from:""].filter(Boolean).join("&"); history.replaceState(null,"",location.pathname+(q?"?"+q:"")); window._mine=null; show("start"); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

async function shareTest(){
  track('share');
  const k = window._res ? window._res.k : ORDER[0];
  const base = location.origin + location.pathname;
  let url, text;
  if (PT){
    const c = getCompat(k, PT), m = ORDER.map(x=>window._res.s[x].toString(16)).join("");
    url = `${base}?r=${k}&m=${m}${WHO==="dad"?"&who=dad":""}&pt=${PT}&v=1&from=share${BGQ}`;
    text = `우리 집 ${D.label.compatShort} ${c.s}점, '${c.t}'래 😆 나는 ${TYPES[k].emoji} ${nm(k)}!`;
  } else {
    url = `${base}?who=${WHO==="mom"?"dad":"mom"}&pt=${k}&from=share${BGQ}`;
    text = `나는 ${TYPES[k].emoji} ${nm(k)}래 😂 ${OTHER}는 무슨 유형일까? 1분이면 끝, 다 하면 우리 궁합 나와!`;
  }
  if (navigator.share){ try { await navigator.share({title:D.title, text, url}); return; } catch(e){ if (e.name==="AbortError") return; } }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast("링크를 복사했어요. 카톡에 붙여 넣어 보내세요!"); }
  catch(e){ prompt("이 주소를 복사해서 보내 주세요", url); }
}

function saveCard(){
  track('save');
  const {k, s} = window._res; const t = TYPES[k];
  const cv = $("cv"), ctx = cv.getContext("2d");
  const img = new Image(); img.src = `img/${k}.jpg`;
  img.onload = () => {
    ctx.fillStyle = "#fbf8f3"; ctx.fillRect(0,0,1080,1350);
    const GH = 700, sh = img.width * GH / 1080;
    ctx.drawImage(img, 0, img.height*0.04, img.width, sh, 0, 0, 1080, GH);
    const gy = GH + 20;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(40, GH-60, 1000, 1350-GH+20, 40); ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = "#6b6577"; ctx.font = "700 36px Pretendard, sans-serif";
    ctx.fillText(F(D.label.result), 540, gy);
    ctx.fillStyle = t.color; ctx.font = "900 80px Pretendard, sans-serif";
    ctx.fillText(`${t.emoji} ${nm(k)}`, 540, gy+100);
    ctx.fillStyle = "#2f2b36"; ctx.font = "700 38px Pretendard, sans-serif";
    ctx.fillText(R(t.line), 540, gy+170);
    const total = ORDER.reduce((a,b)=>a+s[b],0) || 1;
    ctx.textAlign = "left"; ctx.font = "700 32px Pretendard, sans-serif";
    ORDER.forEach((x,i)=>{ const y = gy+235+i*52, p = Math.round(s[x]/total*100);
      ctx.fillStyle="#2f2b36"; ctx.fillText(`${TYPES[x].emoji} ${short(x)}`, 100, y+28);
      ctx.fillStyle="#efeaf5"; ctx.beginPath(); ctx.roundRect(380, y+6, 500, 26, 13); ctx.fill();
      ctx.fillStyle=TYPES[x].color; ctx.beginPath(); ctx.roundRect(380, y+6, Math.max(26,500*p/100), 26, 13); ctx.fill();
      ctx.fillStyle="#2f2b36"; ctx.textAlign="right"; ctx.fillText(`${p}%`, 980, y+30); ctx.textAlign="left"; });
    ctx.textAlign = "center";
    if (PT){ const c = getCompat(k, PT);
      ctx.fillStyle = D.main; ctx.font = "900 38px Pretendard, sans-serif";
      ctx.fillText(`💑 ${D.label.compatShort} ${c.s}점 · ${c.t}`, 540, 1250); }
    ctx.fillStyle = D.main; ctx.font = "800 30px Pretendard, sans-serif";
    ctx.fillText(D.label.card, 540, 1310);
    cv.toBlob(async b => {
      const f = new File([b], `${D.slug}_${nm(k)}.png`, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[f]})){ try { await navigator.share({files:[f]}); return; } catch(e){ if (e.name==="AbortError") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
      toast("결과 카드를 저장했어요");
    }, "image/png");
  };
}

})();
