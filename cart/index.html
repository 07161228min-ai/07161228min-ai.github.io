const TYPES = D.types, ORDER = Object.keys(TYPES), Q = D.questions;
let cur = 0, ans = [];
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const from = QS.get("from") || "direct";
const WHO = QS.get("who")==="dad" ? "dad" : "mom";
const ROLE = WHO==="dad" ? "아빠" : "엄마", OTHER = WHO==="dad" ? "엄마" : "아빠";
const BG = QS.get("b")==="1", BGQ = BG ? "&b=1" : "";
const PT = TYPES[QS.get("pt")] ? QS.get("pt") : null;
const R = s => WHO==="dad" ? s.replaceAll("엄마","아빠") : s;
const RO = s => WHO==="dad" ? s.replaceAll("아빠","엄마") : s;
const F = s => s.replaceAll("{ROLE}", ROLE).replaceAll("{OTHER}", OTHER);
const nm = k => TYPES[k].name.replace("엄마", ROLE);
const ptName = k => TYPES[k].name.replace("엄마", OTHER);
const short = k => TYPES[k].name.replace(" 엄마","");
const ckey = (a,b) => [a,b].sort((x,y)=>ORDER.indexOf(x)-ORDER.indexOf(y)).join("");
const getCompat = (a,b) => D.compat[ckey(a,b)];

function track(ev){ try{ if (window.gtag) gtag('event', ev, {from}); }catch(e){} }
function show(id){ ["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide", s!==id)); window.scrollTo(0,0); }
function begin(){ cur=0; ans=[]; show("quiz"); render(); track('start'); }
function render(){
  const [q, opts] = Q[cur];
  $("qno").textContent = `Q${cur+1} / ${Q.length}`;
  $("prog").style.width = `${cur/Q.length*100}%`;
  $("qtext").textContent = R(q);
  $("opts").innerHTML = "";
  const shuffled = opts.map((o,i)=>[o,(i*7+cur*3)%4]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  shuffled.forEach(([t,label])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=R(label);
    if (ans[cur]===t) b.classList.add("on");
    b.onclick=()=>{ b.classList.add("on"); ans[cur]=t; setTimeout(next,170); };
    $("opts").appendChild(b);
  });
  $("back").style.visibility = cur ? "visible" : "hidden";
}
function next(){ if (cur < Q.length-1){ cur++; render(); } else finish(); }
function prev(){ if (cur>0){ cur--; render(); } }
function scores(a){ const s={}; ORDER.forEach(k=>s[k]=0); a.forEach(t=>s[t]++); return s; }
function finish(){
  const s = scores(ans);
  let top = ORDER.reduce((a,b)=> s[b]>s[a]?b:a, ORDER[0]);
  const tied = ORDER.filter(k=>s[k]===s[top]);
  if (tied.length>1){ for (let i=ans.length-1;i>=0;i--){ if (tied.includes(ans[i])){ top=ans[i]; break; } } }
  const keep = `${WHO==="dad"?"&who=dad":""}${PT?"&pt="+PT:""}${from!=="direct"?"&from="+from:""}${BGQ}`;
  history.replaceState(null,"",`?r=${top}&m=${ORDER.map(k=>s[k].toString(16)).join("")}${keep}`);
  window._mine = top;
  showResult(top, s);
  track('finish');
}
function showResult(k, s){
  const t = TYPES[k];
  $("rsmall").textContent = F(D.label.result);
  $("rname").textContent = `${t.emoji} ${nm(k)}`;
  $("rname").style.color = t.color;
  $("rline").textContent = R(t.line);
  $("rimg").src = `img/${k}.jpg`; $("rimg").alt = nm(k);
  $("rdesc").textContent = R(t.desc);
  $("hmix").textContent = D.label.mix;
  $("htips").textContent = D.label.tips;
  $("rgood").innerHTML = t.good.map(x=>`<li>${R(x)}</li>`).join("");
  $("rtips").innerHTML = t.tips.map(x=>`<li>${R(x)}</li>`).join("");
  $("lbest").textContent = F(D.label.best); $("lworst").textContent = F(D.label.worst);
  $("rbest").textContent = `${TYPES[t.best].emoji} ${ptName(t.best)}`;
  $("rworst").textContent = `${TYPES[t.worst].emoji} ${ptName(t.worst)}`;
  const total = ORDER.reduce((a,b)=>a+s[b],0) || 1;
  $("mix").innerHTML = ORDER.map(x=>{ const p=Math.round(s[x]/total*100);
    return `<div class="row"><span>${TYPES[x].emoji} ${short(x)}</span><div class="track"><i style="width:${p}%;background:${TYPES[x].color}"></i></div><b>${p}%</b></div>`; }).join("");
  $("others").innerHTML = ORDER.filter(x=>x!==k).map(x=>`<button onclick="peek('${x}')"><img src="img/${x}.jpg" alt="">${TYPES[x].emoji} ${nm(x)}</button>`).join("");
  const mine = window._mine || k;
  if (PT && k===mine){
    const c = getCompat(mine, PT);
    const momK = WHO==="mom" ? mine : PT, dadK = WHO==="mom" ? PT : mine;
    $("compat").innerHTML = `<div class="ct">💑 ${D.label.compat}</div>
      <div class="cp">엄마 ${TYPES[momK].emoji} ${short(momK)} × 아빠 ${TYPES[dadK].emoji} ${short(dadK)}</div>
      <div class="cs">${c.s}<small>점</small></div><div class="cn">${c.t}</div>
      <div class="cd">${c.d}</div><div class="ctip">💡 ${c.tip}</div>`;
    $("compat").classList.remove("hide");
    $("sharebtn").textContent = `💑 우리 궁합 결과 ${OTHER}에게 보내기`;
  } else {
    $("compat").classList.add("hide");
    $("sharebtn").textContent = WHO==="mom" ? "👨 아빠는 무슨 유형일까? 보내기" : "👩 엄마는 무슨 유형일까? 보내기";
  }
  window._res = {k: mine, s};
  show("result");
}
function peek(x){ const s = window._res ? window._res.s : scores([]); showResult(x, s); toast(`${nm(x)} 구경 중이에요`); }
function restart(){ const q = [WHO==="dad"?"who=dad":"", PT?"pt="+PT:"", BG?"b=1":"", from!=="direct"?"from="+from:""].filter(Boolean).join("&"); history.replaceState(null,"",location.pathname+(q?"?"+q:"")); window._mine=null; show("start"); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

async function shareTest(){
  track('share');
  const k = window._res ? window._res.k : ORDER[0];
  const base = location.origin + location.pathname;
  let url, text;
  if (PT){
    const c = getCompat(k, PT), m = ORDER.map(x=>window._res.s[x].toString(16)).join("");
    url = `${base}?r=${k}&m=${m}${WHO==="dad"?"&who=dad":""}&pt=${PT}&v=1&from=share${BGQ}`;
    text = `우리 집 ${D.label.compatShort} ${c.s}점, '${c.t}'래 😆 나는 ${TYPES[k].emoji} ${nm(k)}!`;
  } else {
    url = `${base}?who=${WHO==="mom"?"dad":"mom"}&pt=${k}&from=share${BGQ}`;
    text = `나는 ${TYPES[k].emoji} ${nm(k)}래 😂 ${OTHER}는 무슨 유형일까? 1분이면 끝, 다 하면 우리 궁합 나와!`;
  }
  if (navigator.share){ try { await navigator.share({title:D.title, text, url}); return; } catch(e){ if (e.name==="AbortError") return; } }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast("링크를 복사했어요. 카톡에 붙여 넣어 보내세요!"); }
  catch(e){ prompt("이 주소를 복사해서 보내 주세요", url); }
}

function saveCard(){
  track('save');
  const {k, s} = window._res; const t = TYPES[k];
  const cv = $("cv"), ctx = cv.getContext("2d");
  const img = new Image(); img.src = `img/${k}.jpg`;
  img.onload = () => {
    ctx.fillStyle = "#fbf8f3"; ctx.fillRect(0,0,1080,1350);
    const GH = 700, sh = img.width * GH / 1080;
    ctx.drawImage(img, 0, img.height*0.04, img.width, sh, 0, 0, 1080, GH);
    const gy = GH + 20;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(40, GH-60, 1000, 1350-GH+20, 40); ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = "#6b6577"; ctx.font = "700 36px Pretendard, sans-serif";
    ctx.fillText(F(D.label.result), 540, gy);
    ctx.fillStyle = t.color; ctx.font = "900 80px Pretendard, sans-serif";
    ctx.fillText(`${t.emoji} ${nm(k)}`, 540, gy+100);
    ctx.fillStyle = "#2f2b36"; ctx.font = "700 38px Pretendard, sans-serif";
    ctx.fillText(R(t.line), 540, gy+170);
    const total = ORDER.reduce((a,b)=>a+s[b],0) || 1;
    ctx.textAlign = "left"; ctx.font = "700 32px Pretendard, sans-serif";
    ORDER.forEach((x,i)=>{ const y = gy+235+i*52, p = Math.round(s[x]/total*100);
      ctx.fillStyle="#2f2b36"; ctx.fillText(`${TYPES[x].emoji} ${short(x)}`, 100, y+28);
      ctx.fillStyle="#efeaf5"; ctx.beginPath(); ctx.roundRect(380, y+6, 500, 26, 13); ctx.fill();
      ctx.fillStyle=TYPES[x].color; ctx.beginPath(); ctx.roundRect(380, y+6, Math.max(26,500*p/100), 26, 13); ctx.fill();
      ctx.fillStyle="#2f2b36"; ctx.textAlign="right"; ctx.fillText(`${p}%`, 980, y+30); ctx.textAlign="left"; });
    ctx.textAlign = "center";
    if (PT){ const c = getCompat(k, PT);
      ctx.fillStyle = D.main; ctx.font = "900 38px Pretendard, sans-serif";
      ctx.fillText(`💑 ${D.label.compatShort} ${c.s}점 · ${c.t}`, 540, 1250); }
    ctx.fillStyle = D.main; ctx.font = "800 30px Pretendard, sans-serif";
    ctx.fillText(D.label.card, 540, 1310);
    cv.toBlob(async b => {
      const f = new File([b], `${D.slug}_${nm(k)}.png`, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[f]})){ try { await navigator.share({files:[f]}); return; } catch(e){ if (e.name==="AbortError") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = f.name; a.click();
      toast("결과 카드를 저장했어요");
    }, "image/png");
  };
}

  $("count").textContent = `${Q.length}문항 · 약 1분 · 답은 저장되지 않아요`;
  if (WHO==="dad"){ document.querySelectorAll("h1 em").forEach(e=>e.textContent=e.textContent.replace("엄마","아빠")); document.title = R(document.title); }
  $("rnote").innerHTML = `재미로 보는 테스트예요. 정답인 ${ROLE} 유형은 없어요 💜${D.note?"<br>"+D.note:""}<br>${D.brand}`;
  $("more").innerHTML = `<h3>🎲 이 테스트도 해 보세요</h3>` + REC.map(x=>`<a href="${x.url}?from=rec${BGQ}" onclick="track('rec')"><img src="${x.img}" alt="" loading="lazy"><div><b>${x.title}</b><span>${x.sub}</span></div></a>`).join("");
  if (PT){ $("invite").innerHTML = `${OTHER}는 ${TYPES[PT].emoji} <b>${ptName(PT)}</b>래요!<br>내 유형까지 알면 💑 우리 집 궁합이 나와요`; $("invite").classList.remove("hide"); }
  if (r && TYPES[r] && m && new RegExp(`^[0-9a-f]{${ORDER.length}}$`).test(m) && (from==="direct" || QS.get("v")==="1")){
    const s={}; ORDER.forEach((k,i)=>s[k]=parseInt(m[i],16)); window._mine = r; showResult(r, s); }
})();
