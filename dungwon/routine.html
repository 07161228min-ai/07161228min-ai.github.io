<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 유형 아침 10분 루틴표 | 맘들의 정보터</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="카톡 친구 선물 · 우리 유형 아침 10분 루틴표">
<meta property="og:description" content="등원 전쟁 테스트 유형별 · 냉장고에 붙이는 아침 루틴표">
<meta property="og:image" content="https://07161228min-ai.github.io/dungwon/img/cover.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --pu:#6a4a9c; --bg:#fbf8f3; --ink:#2f2b36; --sub:#6b6577; --line:#e8e1f1; --c:#6a4a9c; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif; color:var(--ink); word-break:keep-all; line-height:1.5; }
.wrap { max-width:520px; margin:0 auto; padding:18px 16px 40px; }
.brand { text-align:center; font-size:13px; font-weight:700; color:var(--pu); }
h1 { text-align:center; font-size:23px; font-weight:900; margin:6px 0 4px; letter-spacing:-.4px; }
.lead { text-align:center; color:var(--sub); font-size:14px; }
.tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:16px 0 12px; }
.tabs button { border:2px solid var(--line); background:#fff; border-radius:14px; padding:8px 2px; font:inherit; font-size:13px; font-weight:800; color:var(--ink); cursor:pointer; }
.tabs button span { display:block; font-size:22px; }
.tabs button.on { border-color:var(--c); background:#f6f1fc; color:var(--c); }
.sheet { background:#fff; border-radius:20px; box-shadow:0 6px 24px rgba(106,74,156,.10); padding:18px 18px 16px; border-top:8px solid var(--c); }
.sh-top { display:flex; gap:12px; align-items:center; }
.sh-top img { width:78px; height:98px; object-fit:cover; border-radius:12px; flex:none; }
.sh-top h2 { font-size:20px; font-weight:900; color:var(--c); line-height:1.25; }
.sh-top p { font-size:13px; color:var(--sub); margin-top:3px; }
.name { margin-top:12px; font-size:14px; font-weight:700; color:var(--sub); border-bottom:2px dashed var(--line); padding-bottom:6px; }
h3 { font-size:15px; font-weight:900; margin:14px 0 6px; display:flex; align-items:center; gap:6px; }
h3 small { font-size:12px; color:var(--sub); font-weight:700; }
.chk { list-style:none; }
.chk li { display:flex; align-items:flex-start; gap:8px; font-size:15px; padding:5px 0; border-bottom:1px solid #f2eef7; }
.chk li::before { content:""; width:18px; height:18px; border:2px solid var(--c); border-radius:5px; flex:none; margin-top:2px; }
.tl { display:grid; grid-template-columns:66px 1fr 34px; gap:0; border:2px solid var(--line); border-radius:12px; overflow:hidden; font-size:14px; }
.tl div { padding:7px 8px; border-bottom:1px solid var(--line); }
.tl .t { background:#faf7fd; color:var(--sub); font-weight:700; font-size:12px; }
.tl .t b { display:block; border-bottom:1.5px solid #cfc4e2; height:16px; margin-top:2px; }
.tl .k { text-align:center; }
.tl .k i { display:inline-block; width:18px; height:18px; border:2px solid var(--c); border-radius:50%; }
.tl .hl { background:#fff6db; font-weight:700; }
.kid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.kid div { border:2px solid var(--line); border-radius:12px; text-align:center; padding:8px 4px; font-size:13px; font-weight:700; }
.kid div span { display:block; font-size:24px; }
.kid div em { display:block; font-style:normal; color:#cfc4e2; font-size:16px; letter-spacing:2px; margin-top:2px; }
.tip { background:#f6f1fc; border-radius:12px; padding:10px 12px; font-size:14px; margin-top:12px; }
.tip b { color:var(--c); }
.foot { text-align:center; color:#9a94a5; font-size:12px; margin-top:12px; }
.btns { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; display:block; border:0; border-radius:14px; padding:14px 8px; font:inherit; font-size:15px; font-weight:800; cursor:pointer; text-align:center; text-decoration:none; }
.b1 { background:var(--pu); color:#fff; }
.b2 { background:#fff; color:var(--pu); border:2px solid var(--pu); }
.note { text-align:center; color:var(--sub); font-size:13px; margin-top:10px; }
@media print {
  @page { size:A4; margin:12mm; }
  body { background:#fff; }
  .wrap { max-width:none; padding:0; }
  .brand, h1, .lead, .tabs, .btns, .note { display:none !important; }
  .sheet { box-shadow:none; border:2px solid var(--c); border-top-width:10px; }
  .sh-top img { width:90px; height:112px; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">맘들의 정보터 · 카톡 친구 선물 🎁</div>
  <h1>우리 유형 아침 10분 루틴표</h1>
  <p class="lead">테스트에서 나온 유형을 골라 보세요.<br>인쇄하거나 캡처해서 냉장고·현관에 붙여 두면 돼요.</p>
  <div class="tabs" id="tabs"></div>
  <div class="sheet" id="sheet"></div>
  <div class="btns">
    <button class="btn b1" onclick="window.print()">🖨 인쇄·PDF 저장</button>
    <a class="btn b2" href="./">🔁 테스트 하러 가기</a>
  </div>
  <p class="note">휴대폰에서는 화면 캡처가 제일 간편해요.<br>시간 칸은 우리 집 등원 시간에 맞춰 직접 적어 주세요.</p>
</div>
<script>
const R = {
  T:{ e:"⏰", n:"시계토끼", c:"#6a4a9c", sub:"계획은 이미 완벽! 이제 '여유 칸'만 넣으면 돼요",
      night:["내일 옷·양말을 의자 위에 (아이가 직접 골라 두기)","가방·준비물 현관에 두기","아침 메뉴 1개 정해 두기","알림장·공지 한 번 더 확인"],
      tl:[["일어나기",""],["세수·옷 입기",""],["아침 먹기",""],["양치·머리",""],["아무것도 안 하는 5분","hl"],["출발!",""]],
      kid:[["👕","옷 입기"],["🧦","양말 신기"],["🎒","가방 메기"]],
      tip:"<b>계획이 틀어지는 날용 한 줄:</b> \"오늘은 늦어도 괜찮은 날\" 카드를 하나 만들어 두세요. 한 달에 한 번 써도 아무 일 안 생겨요." },
  N:{ e:"🤝", n:"협상가", c:"#3d8a68", sub:"고르게 하는 건 최고! 이제 '마감 시간'만 정하면 돼요",
      night:["내일 옷 2벌 꺼내 두기 (아침에 아이가 1벌 고르기)","아침 메뉴 후보 2개 정하기","머리 스타일 2가지 정해 두기","가방은 전날 밤 현관에"],
      tl:[["일어나기",""],["옷 고르기 (2벌 중 1)",""],["아침 고르기 (2개 중 1)",""],["머리 고르기 (2개 중 1)",""],["협상 마감 ⏰","hl"],["출발!",""]],
      kid:[["👗","옷 고르기"],["🍙","메뉴 고르기"],["🎀","머리 고르기"]],
      tip:"<b>마감 말하는 법:</b> \"긴 바늘이 6에 가면 출발이야\" 처럼 시계로 약속하면, 엄마·아빠 대신 시계가 마감을 알려 줘요." },
  F:{ e:"🚒", n:"소방관", c:"#d62828", sub:"전날 밤엔 딱 1개만! 나머지는 현관 '출동 바구니'가 해결",
      night:["딱 하나만: 가방 + 내일 옷을 현관에 두기"],
      tl:[["일어나기",""],["옷 입기 (현관 옷 그대로)",""],["출동 바구니 챙기기","hl"],["가는 길 아침 (바나나·주먹밥)",""],["출발!",""]],
      kid:[["🧦","양말"],["😷","마스크"],["🥤","물통"],["🧻","손수건"],["📝","준비물"],["🧢","모자"]],
      kidTitle:"현관 출동 바구니 체크",
      tip:"<b>출동 바구니:</b> 현관 문고리에 작은 바구니를 걸고 양말·마스크·물통을 넣어 두세요. 아침에 찾으러 다니는 시간이 사라져요." },
  P:{ e:"🐼", n:"느긋 판다", c:"#c07a2c", sub:"기다려 주는 힘은 그대로! 시작만 10분 일찍",
      night:["알람을 평소보다 10분 일찍","특별한 날인지 1분 체크 (체험학습·사진 찍는 날·준비물)","가방만 현관에 두기"],
      tl:[["일어나기 (10분 일찍)",""],["혼자 옷 입기 기다리기","hl"],["아침 먹기",""],["혼자 신발 신기 기다리기","hl"],["출발!",""]],
      kid:[["👕","혼자 옷 입기"],["👟","혼자 신발"],["🎒","혼자 가방"]],
      tip:"<b>기다림을 시간표에:</b> 기다리는 시간을 미리 칸으로 넣어 두면, 늦을까 봐 조급해지지 않고 아이의 '내가 할래'를 끝까지 지켜 줄 수 있어요." }
};
const ORDER = ["T","N","F","P"];
const $ = id => document.getElementById(id);
let cur = new URLSearchParams(location.search).get("t");
if (!R[cur]) cur = "T";
$("tabs").innerHTML = ORDER.map(k=>`<button data-k="${k}" onclick="pick('${k}')"><span>${R[k].e}</span>${R[k].n}</button>`).join("");
function pick(k){
  cur = k; const r = R[k];
  document.documentElement.style.setProperty("--c", r.c);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  $("sheet").innerHTML = `
    <div class="sh-top"><img src="img/${k}.jpg" alt=""><div><h2>${r.e} ${r.n} 유형의<br>아침 10분 루틴표</h2><p>${r.sub}</p></div></div>
    <div class="name">우리 아이 이름: &nbsp;</div>
    <h3>🌙 전날 밤 <small>자기 전 체크</small></h3>
    <ul class="chk">${r.night.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>☀️ 아침 순서 <small>시간은 직접 적기</small></h3>
    <div class="tl">${r.tl.map(([s,c])=>`<div class="t ${c}">시각<b></b></div><div class="${c}">${s}</div><div class="k ${c}"><i></i></div>`).join("")}</div>
    <h3>🙋 ${r.kidTitle || "아이가 혼자 하는 것"} <small>했으면 ★</small></h3>
    <div class="kid">${r.kid.map(([i,s])=>`<div><span>${i}</span>${s}<em>☆ ☆ ☆ ☆ ☆</em></div>`).join("")}</div>
    <div class="tip">${r.tip}</div>
    <p class="foot">맘들의 정보터 · 아침 등원 전쟁 테스트 카톡 친구 선물</p>`;
  history.replaceState(null,"","?t="+k);
}
pick(cur);
</script>
</body>
</html>
