    const pad = document.querySelector("#start .pad");
    pad.insertBefore(box, pad.querySelector(".btn.main"));
    pad.querySelector(":scope > .btn.main").classList.add("hide");
  }
})();

// ---- 미션표 이미지 (냉장고용) ----
async function missionImage() {
  if (!CUR) return;
  saveChecks();
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, P = 70, rowH = 112, H = 520 + CUR.week.length * rowH + 200;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), F = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  g.fillStyle = "#f6f8f4"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; round(g, 40, 40, W - 80, H - 80, 44); g.fill();
  g.fillStyle = "#2f8f6b"; round(g, 40, 40, W - 80, 230, 44); g.fill(); g.fillRect(40, 200, W - 80, 70);
  g.fillStyle = "#fff"; g.textAlign = "center";
  g.font = "700 34px " + F; g.fillText("건강마컨 · 이른 갱년기 신호 체크리스트", W / 2, 120);
  g.font = "900 64px " + F; g.fillText("나를 위한 7일 몸 돌봄 미션", W / 2, 205);
  g.fillStyle = "#26302b"; g.font = "800 44px " + F; g.fillText(CUR.name, W / 2, 350);
  g.fillStyle = "#66716b"; g.font = "600 32px " + F; g.fillText(CUR.date + " 시작 · 하나씩 체크해 보세요", W / 2, 410);
  g.textAlign = "left";
  CUR.week.forEach((w, k) => {
    const y = 480 + k * rowH;
    g.strokeStyle = "#2f8f6b"; g.lineWidth = 5; round(g, P + 20, y, 62, 62, 14); g.stroke();
    if (CUR.checks[k]) { g.fillStyle = "#2f8f6b"; round(g, P + 20, y, 62, 62, 14); g.fill(); g.fillStyle = "#fff"; g.font = "900 46px " + F; g.fillText("✓", P + 33, y + 48); }
    g.fillStyle = "#2f8f6b"; g.font = "800 28px " + F; g.fillText((k + 1) + "일", P + 110, y + 26);
    g.fillStyle = "#26302b"; g.font = "700 36px " + F; wrap(g, w, P + 110, y + 70, W - P * 2 - 130, 40);
    g.strokeStyle = "#dde7e1"; g.lineWidth = 2; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(P + 20, y + rowH - 14); g.lineTo(W - P - 20, y + rowH - 14); g.stroke(); g.setLineDash([]);
  });
  g.fillStyle = "#8c958f"; g.font = "600 26px " + F; g.textAlign = "center";
  g.fillText("진단이 아닌 생활 습관 참고용이에요 · 일주일 뒤 다시 체크해 보세요", W / 2, H - 90);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], "나를위한_7일몸돌봄미션.png", { type: "image/png" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "나를 위한 7일 몸 돌봄 미션" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const ov = document.createElement("div"); ov.className = "imgov";
  ov.innerHTML = `<div><p>이미지를 꾹 눌러 저장하세요</p><img src="${url}" alt="7일 미션표"><a class="btn main" href="${url}" download="나를위한_7일몸돌봄미션.png">다운로드</a><button class="btn line" onclick="this.closest('.imgov').remove()">닫기</button></div>`;
  document.body.appendChild(ov);
}
function round(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, s, x, y, max, lh) { let line = ""; for (const ch of s) { if (g.measureText(line + ch).width > max) { g.fillText(line, x, y); line = ch; y += lh; } else line += ch; } g.fillText(line, x, y); }
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
async function share() {
  const url = location.href.split("?")[0] + "?from=share";
  const data = { title: "40대 엄마 이른 갱년기 신호 5분 체크리스트", text: "15문항 5분! 육아 피로인지 갱년기 신호인지 같이 체크해 봐요 🌡️", url };
  try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); } catch (e) { prompt("링크를 복사해 주세요", url); }
}
